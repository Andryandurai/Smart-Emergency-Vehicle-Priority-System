# SEVPS edge configuration.
#
# Nginx is in front of Daphne for three jobs that an ASGI server should not be
# doing: serving static assets, terminating TLS, and absorbing slow or hostile
# clients so they occupy an nginx connection rather than a Python worker.
#
# The WebSocket configuration is the part most likely to be got wrong, and the
# failure is quiet: without the Upgrade/Connection headers the handshake gets a
# 200 instead of a 101, the browser falls back to polling, and the console
# still works - just seconds behind, with nothing on screen to say so.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The real client IP, for rate limiting and Django's logs. Only trusted
    # because the proxy chain in front of this is ours; see the note on
    # set_real_ip_from in docs/DEPLOYMENT.md before putting a CDN in front.
    log_format sevps '$remote_addr - $upstream_addr [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log sevps;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;
    client_max_body_size 12m;   # camera frame uploads for the CV pipeline

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/csv application/json application/javascript
        application/geo+json image/svg+xml application/manifest+json;
    # Never gzip an event stream: buffering to fill a compression window adds
    # latency to exactly the traffic that must not have any.
    gzip_disable "msie6";

    # -----------------------------------------------------------------------
    # Rate limiting.
    #
    # Two zones with very different purposes:
    #   auth - credential stuffing protection. Tight, because a legitimate
    #          user signs in once and a script tries thousands of times.
    #   api  - a backstop against a runaway client. Generous: the console
    #          legitimately polls several endpoints every 2-3 seconds, and a
    #          limit that catches that would break the product.
    #
    # Telemetry is deliberately NOT limited here. An ambulance reporting its
    # position at 1 Hz during a mass-casualty incident, with twenty vehicles
    # behind one control-room NAT, is exactly the traffic pattern a naive
    # per-IP limit mistakes for an attack.
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Required for the WebSocket handshake: pass Upgrade through, and send
    # `Connection: close` for ordinary requests rather than a stale keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream sevps_app {
        # `web` resolves to every replica in the compose network; nginx
        # round-robins across them.
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers ---------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Geolocation is granted to self: the paramedic and driver screens
        # need it. Camera and microphone are not - nothing here uses them, and
        # denying them means a compromised dependency cannot start.
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

        # Tile providers, and Leaflet needs inline styles. 'unsafe-inline' for
        # style-src is a real concession to Leaflet's runtime styling; script
        # -src stays strict, which is where it matters.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://api.mapbox.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss: https://api.mapbox.com; worker-src 'self'; frame-ancestors 'none'" always;

        # --- Health -------------------------------------------------------
        # Unlogged and unlimited: a probe every few seconds from a load
        # balancer would otherwise dominate the access log and, worse, could
        # trip the api rate-limit zone and take the instance out of service.
        location = /api/v1/health/live/ {
            access_log off;
            proxy_pass http://sevps_app;
            proxy_set_header Host $host;
        }
        location = /api/v1/health/ready/ {
            access_log off;
            proxy_pass http://sevps_app;
            proxy_set_header Host $host;
        }

        # --- WebSockets ---------------------------------------------------
        location /ws/ {
            proxy_pass http://sevps_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A live dashboard holds a socket open all shift. The default
            # 60-second read timeout would cut it every minute, and the
            # symptom - a console that silently reconnects and misses frames -
            # is much harder to diagnose than an outage.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            limit_conn conn 24;
        }

        # --- Service worker ------------------------------------------------
        # Must be served from the root with no caching; a stale worker keeps
        # handling pushes with old logic long after a deploy. See
        # apps/dashboards/views.py.
        location = /sw.js {
            proxy_pass http://sevps_app;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
        }

        # --- Authentication ------------------------------------------------
        location ~ ^/api/v1/auth/(jwt/create|token)/ {
            limit_req zone=auth burst=6 nodelay;
            proxy_pass http://sevps_app;
            include /etc/nginx/conf.d/proxy_headers.inc;
        }

        # --- API ------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=120 nodelay;
            proxy_pass http://sevps_app;
            include /etc/nginx/conf.d/proxy_headers.inc;

            # Analytics CSV exports stream; buffering them defeats the point
            # and holds a whole file in nginx memory.
            proxy_buffering on;
            proxy_read_timeout 120s;
        }

        location /admin/ {
            proxy_pass http://sevps_app;
            include /etc/nginx/conf.d/proxy_headers.inc;
        }

        # --- Static assets ---------------------------------------------------
        # Vite emits content-hashed filenames, so these are immutable: a
        # changed file gets a new name. index.html is not hashed and must
        # never be cached, or a browser keeps loading the old bundle names
        # after a deploy and the app 404s its own chunks.
        location /static/ {
            alias /srv/static/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        location /media/ {
            alias /srv/media/;
            expires 1h;
        }

        # --- SPA ------------------------------------------------------------
        location / {
            proxy_pass http://sevps_app;
            include /etc/nginx/conf.d/proxy_headers.inc;
            add_header Cache-Control "no-store" always;
        }
    }
}
