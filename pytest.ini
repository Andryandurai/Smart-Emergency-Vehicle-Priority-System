; Pytest configuration (Phase 12).
;
; Pytest is adopted as the **runner**, not as a rewrite. The 418 existing
; `django.test.TestCase` classes are collected and executed unchanged - pytest
; runs unittest-style tests natively - so `manage.py test` and `pytest` both
; work and produce the same results. That was the condition for adopting it at
; all: a migration that required touching 418 working tests would risk more
; than it gained.
;
; What pytest adds is what unittest makes awkward: parametrisation over a
; matrix (see the RBAC matrix in apps/core/tests_rbac_matrix.py - 6 roles by
; ~40 endpoints, expressed once), fixtures composed by dependency rather than
; by inheritance, and markers for selecting subsets.

[pytest]
DJANGO_SETTINGS_MODULE = sevps.settings
python_files = tests.py test_*.py tests_*.py
python_classes = Test* *Tests
python_functions = test_*

; --reuse-db is deliberately NOT default. SEVPS migrations create PostGIS
; generated columns and GiST indexes; a stale reused database silently skips
; them and spatial tests then pass against the wrong schema. Opt in with
; `pytest --reuse-db` when iterating on a single test.
addopts =
    --strict-markers
    --strict-config
    -ra
    --durations=10

markers =
    smoke: minimal set proving the platform is alive. Run first in CI.
    rbac: authorisation matrix. Failing one of these is a security regression.
    slow: takes over a second; excluded from the pre-commit run.
    spatial: needs PostGIS; skipped automatically on SQLite.
    ml: trains or loads a model; skipped when scikit-learn is absent.

filterwarnings =
    ; A warning that appears during a test is usually a deprecation the next
    ; Django upgrade will turn into an error. Surface them rather than let
    ; them scroll past.
    default
    ignore::DeprecationWarning:daphne.*
    ignore::DeprecationWarning:channels.*

; Quieten the application's own logging; a failing assertion is easier to read
; without 200 lines of dispatch telemetry above it. Override with -o log_cli=1.
log_cli = false
log_level = CRITICAL
